<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pyth Yield Test</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --fg: #1c2230;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131722;
        --fg: #d1d4dc;
      }
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    h2 {
      font-size: 1rem;
      margin: 0 0 8px;
    }
    tv-market-overview {
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-market-overview.js"></script>

  <div class="grid">
    <section>
      <h2>Test: Pyth Treasury yields (2, 5, 10, 30 year)</h2>
      <tv-market-overview symbol-sectors='[{"sectionName":"Pyth","symbols":["PYTH:US02Y","PYTH:US05Y","PYTH:US10Y","PYTH:US30Y"]}]'></tv-market-overview>
    </section>
  </div>
</body>
</html>
