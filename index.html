<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Overview</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --fg: #1c2230;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131722;
        --fg: #d1d4dc;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      width: 100%;
      max-width: 960px;
    }
    tv-market-overview {
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>
  <main>
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-market-overview.js"></script>

    <tv-market-overview symbol-sectors='[{"sectionName":"Indices","symbols":["FOREXCOM:SPXUSD","CAPITALCOM:NAS100","FOREXCOM:DJI"]},{"sectionName":"Stocks","symbols":["NASDAQ:AAPL","NASDAQ:NVDA","NASDAQ:TSLA","NASDAQ:AMD","NASDAQ:ANT","NASDAQ:MSFT","NASDAQ:AVGO","NYSE:V"]},{"sectionName":"Bonds","symbols":["NASDAQ:TLT","NASDAQ:IEF","NASDAQ:SHY"]}]'></tv-market-overview>
  </main>
</body>
</html>
