<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Overview Test</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --fg: #1c2230;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131722;
        --fg: #d1d4dc;
      }
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    h2 {
      font-size: 1rem;
      margin: 0 0 8px;
    }
    tv-market-overview {
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-market-overview.js"></script>

  <div class="grid">
    <section>
      <h2>Stocks (original eight)</h2>
      <tv-market-overview symbol-sectors='[{"sectionName":"Stocks","symbols":["NASDAQ:AAPL","NASDAQ:NVDA","NASDAQ:TSLA","NASDAQ:AMD","NASDAQ:ANT","NASDAQ:MSFT","NASDAQ:AVGO","NYSE:V"]}]'></tv-market-overview>
    </section>

    <section>
      <h2>Test 1: CBOT Treasury futures</h2>
      <tv-market-overview symbol-sectors='[{"sectionName":"CBOT","symbols":["CBOT:ZB1!","CBOT:UB1!","CBOT:ZN1!","CBOT:ZF1!"]}]'></tv-market-overview>
    </section>

    <section>
      <h2>Test 2: OANDA bond CFDs</h2>
      <tv-market-overview symbol-sectors='[{"sectionName":"OANDA","symbols":["OANDA:USB02YUSD","OANDA:USB05YUSD","OANDA:USB10YUSD","OANDA:USB30YUSD"]}]'></tv-market-overview>
    </section>

    <section>
      <h2>Test 3: Treasury ETFs</h2>
      <tv-market-overview symbol-sectors='[{"sectionName":"ETFs","symbols":["NASDAQ:TLT","NASDAQ:IEF","NASDAQ:SHY"]}]'></tv-market-overview>
    </section>

    <section>
      <h2>Test 4: Eurex Bund futures</h2>
      <tv-market-overview symbol-sectors='[{"sectionName":"Eurex","symbols":["EUREX:FGBL1!","EUREX:FGBM1!"]}]'></tv-market-overview>
    </section>
  </div>
</body>
</html>
